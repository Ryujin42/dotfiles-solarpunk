source = ~/.config/hypr/colors.conf

# WALLPAPER
general {
    grace = 0
}

# BACKGROUND
background {
    monitor =
    path = ~/dotfiles/src/wallpaper/solarpunk-house.jpg # screenshot
    blur_passes = 3 # 0 disables blurring
}

# PASSWORD-BOX
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(94e2ffff)
    inner_color = rgba(1e1e2e29)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    placeholder_text =
    hide_input = false
    rounding = -1
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
    fail_text =
    fail_transition = 300
    position = 0, 75
    halign = center
    valign = bottom
}

# NOW TIME
label {
    monitor =
    text = cmd[update:1000] echo $(date +"%H:%M:%S")
    color = rgba(94e2ffff)
    font_size = 70
    font_family = CaskaydiaMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo $(date +"%A, %d %B %Y")
    color = rgb(cdd6f4)
    font_size = 24
    font_family = CaskaydiaMono Nerd Font Bold
    position = 0, 0
    halign = center
    valign = center
}

# LOCK LOGO
label {
    monitor =
    text = 
    color = rgb(cdd6f4)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 30
    halign = center
    valign = bottom
}

